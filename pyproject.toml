[project]
name = "hased"
version = "0.1.0"
description = "Detection of important sound events in hearing-aid signals (master's thesis, Ghent University)"
requires-python = ">=3.11"
dependencies = [
    "librosa",
    "matplotlib",
    "numpy",
    "pyclarity",  # CEC2 HOA tools; also brings torch
    "pyyaml",
    "scipy",
    "soundfile",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hased"]

[tool.ruff]
line-length = 100
